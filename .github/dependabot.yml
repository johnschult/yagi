# Dependabot proposes updates as pull requests, and raises an alert for a dependency with a known vulnerability.
# Each group of updates comes as one pull request, so a week's worth is a single thing to review.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Odd-numbered Node releases never become long-term support; stay on the even ones.
      - dependency-name: "@types/node"
        versions: ["25.x", "27.x", "29.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]
