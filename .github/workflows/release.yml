name: Release

# A tag named vYYYY.MM.PATCH (for example v2026.10.0) publishes the container image
# to ghcr.io and creates a GitHub release whose notes are that version's section of
# CHANGELOG.md (a tag with no section fails before anything is published), with archives of the program for Linux and
# macOS attached; the images and the archives' checksums are signed. Changes to the Dockerfile or this file only
# build them, so a broken release can't be a surprise.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
      id-token: write # sign the images, keylessly (Sigstore), as this workflow
    env:
      IMAGE: ghcr.io/johnschult/yagi
      # The image's name before the rename, still pushed with the same tags for a few releases so existing compose files keep updating.
      IMAGE_LEGACY: ghcr.io/johnschult/antennarr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]{4}\.(0?[1-9]|1[0-2])\.[0-9]+$ ]]; then
              echo "::error::the tag must look like vYYYY.MM.PATCH (v2026.10.0), not $GITHUB_REF_NAME"
              exit 1
            fi
            # The release notes are this version's section of CHANGELOG.md. Check now,
            # before anything is published, so a forgotten entry can't ship.
            awk -v v="$version" '
              /^## / { if (found) exit; split($0, h, " "); if (h[2] == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            if [[ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]]; then
              echo "::error::CHANGELOG.md has no entry for $version; add a '## $version (date)' section and tag again"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:$version,$IMAGE:latest,$IMAGE_LEGACY:$version,$IMAGE_LEGACY:latest" >> "$GITHUB_OUTPUT"
            echo "tags_tailscale=$IMAGE:$version-tailscale,$IMAGE:tailscale" >> "$GITHUB_OUTPUT"
          else
            version=dev
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:ci" >> "$GITHUB_OUTPUT"
            echo "tags_tailscale=$IMAGE:ci-tailscale" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: steps.v.outputs.release == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push, for a release)
        id: plain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.release == 'true' }}
          tags: ${{ steps.v.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same program with the built-in Tailscale node (see docs/tailscale.md). A separate image so the plain one
      # stays free of that code; the layers they share come from the cache.
      - name: Build the Tailscale image (and push, for a release)
        id: tailscale
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.release == 'true' }}
          tags: ${{ steps.v.outputs.tags_tailscale }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            TAGS=tsnet
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tailscale
          cache-to: type=gha,mode=max,scope=tailscale

      # Sign each image by its digest, so what is signed is exactly what was pushed. The signature says which workflow built
      # it: check with cosign verify (see "Verifying a download" in docs/security.md).
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.v.outputs.release == 'true'
      - name: Sign the images
        if: steps.v.outputs.release == 'true'
        env:
          PLAIN: ${{ env.IMAGE }}@${{ steps.plain.outputs.digest }}
          TAILSCALE: ${{ env.IMAGE }}@${{ steps.tailscale.outputs.digest }}
        run: cosign sign --yes "$PLAIN" "$TAILSCALE"

      - name: Create the GitHub release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A draft: releases here are immutable once published, so the files have to be attached first (see `binaries`).
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

  # The program on its own, for people without Docker (and for the install script and the Homebrew formula): one
  # archive for each system, and a checksums.txt to check them against. Built on a pull request too, without
  # being published. It runs after the image so the release it attaches to exists.
  binaries:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the files to the GitHub release
      id-token: write # sign them, keylessly (Sigstore), as this workflow
      attestations: write # record how they were built
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web page, which the program embeds
        run: |
          cd web
          npm ci
          npm run build
      - name: Build and pack for each system
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=dev
          if [[ "$REF" == refs/tags/v* ]]; then version="${REF_NAME#v}"; fi
          mkdir -p dist
          # The plain program, and the same with the built-in Tailscale node (-tags tsnet), as the images are. The
          # Tailscale one says which version it is, which the library otherwise reports as "-ERR-BuildInfo" in the
          # Tailscale admin console (see the Dockerfile).
          ts=$(go list -m -f '{{.Version}}' tailscale.com); ts=${ts#v}
          for flavor in "" tailscale; do
            tags=""; ldflags="-s -w -X github.com/johnschult/yagi/internal/version.Version=$version"
            if [[ -n "$flavor" ]]; then
              tags=tsnet
              ldflags="$ldflags -X tailscale.com/version.shortStamp=${ts} -X tailscale.com/version.longStamp=${ts}-yagi${version}"
            fi
            for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
              os="${target%/*}"; arch="${target#*/}"
              name="yagi_${version}_${os}_${arch}${flavor:+_$flavor}"
              mkdir -p "build/$name"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -tags "$tags" -ldflags "$ldflags" \
                -o "build/$name/yagi" ./cmd/yagi
              cp LICENSE README.md "build/$name/"
              tar -C build -czf "dist/$name.tar.gz" "$name"
            done
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt)
      # One signature over checksums.txt covers every archive, since it lists their hashes. It is made with this
      # workflow's own identity (no key to keep), recorded in Sigstore's public log, and checked straight away. It is
      # made on a pull request from this repository too, so the whole path is tried before a release, but not attached.
      - name: Install cosign
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign checksums.txt, and check the signature
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        env:
          REPO: ${{ github.repository }}
        run: |
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          cosign verify-blob --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${REPO}/\.github/workflows/release\.yml@refs/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt
      - name: Record how the archives were built
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Check the builds for this machine run
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=dev
          if [[ "$REF" == refs/tags/v* ]]; then version="${REF_NAME#v}"; fi
          for flavor in "" _tailscale; do
            name="yagi_${version}_linux_amd64${flavor}"
            tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/$name/yagi" -version
          done
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt dist/checksums.txt.sigstore.json install.sh
      # Publishing locks the release: its files can no longer change. If anything above fails it stays a draft.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # Updates the Homebrew formula in the tap (johnschult/homebrew-tap) to this release: the version and the SHA-256 of
  # each archive, from the checksums.txt the release just got. It needs a token that can write to that repository
  # alone, saved here as the secret HOMEBREW_TAP_TOKEN. If it fails, the release is fine; run this job again.
  homebrew:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the formula
        env:
          TAG: ${{ github.ref_name }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::the secret HOMEBREW_TAP_TOKEN isn't set: make a fine-grained token with Contents (read and write) on johnschult/homebrew-tap only, and save it in this repository's secrets"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "https://github.com/johnschult/yagi/releases/download/$TAG/checksums.txt"
          for f in yagi yagi-tailscale; do
            sh scripts/render_formula.sh "${TAG#v}" "$RUNNER_TEMP/checksums.txt" "$f" > "$RUNNER_TEMP/$f.rb"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: johnschult/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push it to the tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd tap
          mkdir -p Formula
          cp "$RUNNER_TEMP/yagi.rb" "$RUNNER_TEMP/yagi-tailscale.rb" Formula/
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "The tap already has ${TAG#v}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/yagi.rb Formula/yagi-tailscale.rb
          git commit -m "yagi ${TAG#v}"
          git push
