name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the plain build has no dependencies to speak of; the Tailscale build's are fetched once per run
      - run: go vet ./...
      - run: go test -race ./...

  # The same again with the built-in Tailscale node (-tags tsnet), which is the only code that uses tailscale.com.
  go-tailscale:
    name: Go (Tailscale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet -tags tsnet ./...
      - run: go test -race -tags tsnet ./...

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test

  # install.sh: shellcheck, then install.sh against a fake release (scripts/install_test.sh) on Linux and
  # macOS, and again on Alpine, whose busybox tools are the least forgiving.
  install-script:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/install_test.sh scripts/render_formula.sh
      - run: sh scripts/install_test.sh
      - name: The Homebrew formulas fill in and are valid Ruby
        run: |
          for t in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            printf '%064d  yagi_2026.10.17_%s.tar.gz\n' 7 "$t"
            printf '%064d  yagi_2026.10.17_%s_tailscale.tar.gz\n' 8 "$t"
          done > "$RUNNER_TEMP/checksums.txt"
          for f in yagi yagi-tailscale; do
            sh scripts/render_formula.sh 2026.10.17 "$RUNNER_TEMP/checksums.txt" "$f" > "$RUNNER_TEMP/$f.rb"
            # (a bare `! cmd` doesn't stop a bash -e script, so these are ifs)
            if grep -n '@[A-Z_]*@' "$RUNNER_TEMP/$f.rb"; then echo "$f.rb has a placeholder left"; exit 1; fi
            ruby -c "$RUNNER_TEMP/$f.rb"
            if sh scripts/render_formula.sh 2026.10.17 /dev/null "$f" 2>/dev/null; then echo "$f rendered with no checksums"; exit 1; fi
          done
      - name: The same on Alpine
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/src:ro" alpine:3 sh -c 'apk add --no-cache curl python3 >/dev/null && sh /src/scripts/install_test.sh'

  # golangci-lint, with the settings in .golangci.yml. Run it locally the same way: golangci-lint run ./...
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # Known vulnerabilities: in the Go code's dependencies and standard library (govulncheck only reports what the
  # code can actually reach), and in the web page's npm packages that ship to the browser.
  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - run: govulncheck -tags tsnet ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
