name: Image scan

# Builds the container image (without publishing it) and scans it with Trivy for known vulnerabilities in what
# is inside it: the base image and the Go binary. It reports to the Security tab and does not fail the build,
# since a vulnerability in somebody else's base image should not stop an unrelated change; look at the Security
# tab, and update the base image (Dependabot proposes that).
on:
  pull_request:
    paths:
      - Dockerfile
      - go.mod
      - web/package.json
      - web/package-lock.json
      - .github/workflows/image-scan.yml
  push:
    branches: [main]
  schedule:
    - cron: "33 5 * * 2"

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag yagi:scan .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: yagi:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy
